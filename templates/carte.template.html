<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{carte.meta_title}}</title>
  <meta name="description" content="{{carte.meta_description}}">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f5efdf">

  <link rel="icon" type="image/svg+xml" href="images/tetechien.svg">

  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=pally@500&display=swap">

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="carte-body">

  <main class="carte">
    <div class="carte__logo-frame">
      <img src="images/logo.svg" alt="{{carte.logo_alt}}" class="carte__logo" width="146" height="146">
    </div>

    <h1 class="carte__tagline">{{carte.tagline}}</h1>
    <p class="carte__subline">{{carte.subline_html}}</p>

    <div class="carte__host">
      <img src="images/tetemaya.png" alt="{{carte.host_maya_alt}}" class="carte__host-img" width="160" height="171">
      <p class="carte__host-text">{{carte.host_html}}</p>
      <img src="images/tetecam.png" alt="{{carte.host_img_alt}}" class="carte__host-img" width="199" height="233">
    </div>

    <ul class="carte__links">
      <li>
        <a href="https://wa.me/33679603262" class="carte__btn carte__btn--primary" target="_blank" rel="noopener">
          <svg class="carte__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91C21.95 6.45 17.5 2 12.04 2zm0 18.15c-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24 4.54 0 8.24 3.7 8.24 8.24 0 4.55-3.69 8.24-8.23 8.24zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.12-.17.25-.64.81-.78.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.14.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.22.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.06-.11-.22-.17-.47-.29z"/></svg>
          <span class="carte__btn-text">
            <span class="carte__btn-title">{{carte.btn_whatsapp_title}}</span>
            <span class="carte__btn-sub">{{carte.btn_whatsapp_sub}}</span>
          </span>
        </a>
      </li>
      <li>
        <a href="./" class="carte__btn">
          <svg class="carte__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18z"></path></svg>
          <span class="carte__btn-text">
            <span class="carte__btn-title">{{carte.btn_site_title}}</span>
            <span class="carte__btn-sub">{{carte.btn_site_sub}}</span>
          </span>
        </a>
      </li>
      <li>
        <a href="https://www.instagram.com/toutoucrew" class="carte__btn" target="_blank" rel="noopener">
          <svg class="carte__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"></circle></svg>
          <span class="carte__btn-text">
            <span class="carte__btn-title">{{carte.btn_instagram_title}}</span>
            <span class="carte__btn-sub">{{carte.btn_instagram_sub}}</span>
          </span>
        </a>
      </li>
      <li>
        <a href="toutoucrew.vcf" class="carte__btn" download>
          <svg class="carte__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="8" r="4"></circle><path d="M2.5 21a7.5 7.5 0 0 1 15 0"></path><path d="M19 8v6"></path><path d="M16 11h6"></path></svg>
          <span class="carte__btn-text">
            <span class="carte__btn-title">{{carte.btn_contact_title}}</span>
            <span class="carte__btn-sub">{{carte.btn_contact_sub}}</span>
          </span>
        </a>
      </li>
    </ul>

  </main>

</body>
</html>
